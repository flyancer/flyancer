<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flyancer – Verified expert profile</title>
  <meta name="description" content="Book 1:1 sessions — referrals, mock interviews, coaching and resume reviews — with a verified professional on Flyancer." />
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="pf.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body class="pf">
  <header class="pf-top">
    <a href="index.html" class="logo">
        <img src="assets/logo-transparent.png" alt="Flyancer" class="logo-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
        <span class="logo-mark" style="display:none;">F</span>
        <span class="logo-text">Flyancer</span>
      </a>
    <nav class="pf-nav"><a href="index.html">Home</a><a href="dashboard.html" id="navDash">Log in</a></nav>
  </header>

  <main class="pf-wrap" id="app"><div class="pf-msg">Loading profile…</div></main>

  <!-- booking request modal -->
  <div class="pf-modal" id="reqModal">
    <form class="pf-form" id="reqForm">
      <h3 id="reqTitle" style="font:800 1.15rem var(--font-display)">Request session</h3>
      <label>Link to the job you're targeting (optional)<input id="reqJob" type="url" placeholder="https://…" /></label>
      <label>Link to your resume (optional)<input id="reqResume" type="url" placeholder="Google Drive / Dropbox link" /></label>
      <label>Message<textarea id="reqMsg" rows="3" placeholder="Tell them what you need help with…"></textarea></label>
      <div class="pf-err" id="reqErr"></div>
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button type="button" class="pf-btn ghost" id="reqCancel">Cancel</button>
        <button type="submit" class="pf-btn" id="reqSend">Send request</button>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  </script>
  <script src="categories.js"></script>
  <script src="avatar.js"></script>
  <script src="profile.js"></script>
</body>
</html>
